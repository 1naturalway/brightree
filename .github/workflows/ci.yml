name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  syntax:
    name: Syntax (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
    steps:
      - uses: actions/checkout@v7

      - name: Set up PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: soap
          coverage: none

      # No runtime dependencies, so this needs no composer install and gives a
      # clean read on whether the source parses on each supported PHP release.
      - name: Lint PHP syntax
        run: |
          find . -path ./vendor -prune -o -name '*.php' -print0 \
            | xargs -0 -r -n1 -P4 php -l

  code-style:
    name: Code style (phpcs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: soap
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@v6
        with:
          path: vendor
          key: composer-${{ runner.os }}-php8.4-${{ hashFiles('composer.json') }}
          restore-keys: composer-${{ runner.os }}-php8.4-

      # composer.lock is intentionally gitignored for a library, so resolve fresh.
      - name: Install dependencies
        run: composer update --prefer-dist --no-progress --no-interaction

      - name: Run phpcs
        run: vendor/bin/phpcs

  package:
    name: Package metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: soap
          coverage: none

      - name: Validate composer.json
        run: composer validate --strict

      - name: Check dependencies resolve
        run: composer update --dry-run --no-interaction
