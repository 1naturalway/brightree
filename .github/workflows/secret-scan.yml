name: Secret scan

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    # Weekly, so a leak introduced outside a PR still surfaces.
    - cron: '0 13 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks (full history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: gitleaks detect walks every commit, not just the tip.
          fetch-depth: 0

      # Run the OSS image directly. gitleaks-action requires a paid license for
      # organization repos; the binary itself does not.
      - name: Run gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:latest \
            detect \
              --source /repo \
              --redact \
              --verbose \
              --report-format sarif \
              --report-path /repo/gitleaks.sarif \
              --exit-code 1

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: gitleaks.sarif
          if-no-files-found: ignore
